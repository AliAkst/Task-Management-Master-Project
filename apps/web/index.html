<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&display=swap"
      rel="stylesheet"
    />
    <script>
      // Parlama olmasin: tema ilk boyamadan once ayarlanir (lib/theme.ts ile ayni anahtarlar)
      ;(function () {
        try {
          var t = localStorage.getItem('ajanda.theme') || 'system'
          var p = localStorage.getItem('ajanda.paper') || 'kagit'
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var el = document.documentElement
          el.setAttribute('data-theme', dark ? 'dark' : 'light')
          el.setAttribute('data-paper', p)
        } catch (e) {}
      })()
    </script>
    <title>Yaşam Planlayıcı</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
