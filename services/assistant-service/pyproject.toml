[project]
name = "assistant-service"
version = "0.1.0"
description = "Kisisel AI asistan: modelden bagimsiz LLM katmani, task-api uzerinden arac kullanimi"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.1",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "openai>=2.0.0",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
# Arac aciklamalari ve benchmark prompt'lari uzun Turkce metinler
"app/tools/read_tools.py" = ["E501"]
"app/agent/context.py" = ["E501"]
"app/tools/write_tools.py" = ["E501"]
"app/agent/actions.py" = ["E501"]
"app/tools/memory_tools.py" = ["E501"]
"tests/*" = ["E501"]
"scripts/benchmark_models.py" = ["E501"]
